name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 在乾淨的 Ubuntu 24.04 容器裡編譯，避開 runner 預設的大量第三方套件來源
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: 安裝 MinGW-w64 交叉編譯器與工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            g++-mingw-w64-i686-win32 binutils-mingw-w64-i686 git ca-certificates curl gpg
          # gh CLI（更新下載頁用）
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq && apt-get install -y -qq gh

      - uses: actions/checkout@v4

      - name: 編譯
        run: sh ./build.sh

      - name: 檢查 XP 相容性（PE 標頭必須是 5.1）
        run: |
          i686-w64-mingw32-objdump -p dist/PcLockdown.exe | grep -E "MajorOSystemVersion\s+5"
          i686-w64-mingw32-objdump -p dist/PcLockdown.exe | grep -E "MajorSubsystemVersion\s+5"
          i686-w64-mingw32-objdump -p dist/PcLockdown.exe | grep "DLL Name"

      - name: 上傳編譯結果
        uses: actions/upload-artifact@v4
        with:
          name: PcLockdown
          path: dist/PcLockdown.exe

      - name: 更新「latest」下載頁
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/PcLockdown.exe \
            --title "PC Lockdown 最新版" \
            --notes "自動編譯版本（commit ${GITHUB_SHA::7}）。支援 Windows XP SP3 ~ Windows 11，下載 PcLockdown.exe 即可直接執行。" \
            --target "$GITHUB_SHA"
